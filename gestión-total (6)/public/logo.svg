<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    
    <!-- Accent Shield/Box Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular background for Android / Mobile icon launchers -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner active container -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <!-- Custom 3D-ish box representing stock/products with digital lightning bolt for "Quick mode" -->
    <!-- Front Face -->
    <path d="M50,110 L150,60 L250,110 L150,160 Z" fill="url(#boxGrad)" opacity="0.95" />
    <path d="M50,110 L50,210 L150,260 L150,160 Z" fill="#047857" opacity="0.85" />
    <path d="M150,160 L150,260 L250,210 L250,110 Z" fill="#065f46" opacity="0.9" />

    <!-- Bolt symbol inside for speed / Quick Mode -->
    <path d="M150,105 L175,130 L155,145 L170,175 L135,140 L150,130 Z" fill="#ffffff" />
  </g>
</svg>
